# Zonas de limitación de tasa (Rate Limiting) definidas en contexto http
limit_req_zone $binary_remote_addr zone=subasta_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=subasta_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=subasta_onboarding_limit:10m rate=3r/m;

# Respuesta HTTP correcta para rate limiting (RFC 6585 §4)
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 30M;

    # Ocultar version de Nginx
    server_tokens off;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self';" always;

    # Respuesta JSON para solicitudes bloqueadas por rate limiting
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"success":false,"error":"Demasiadas solicitudes. Por favor espera unos segundos antes de intentar de nuevo."}';
    }

    # Bloquear acceso a archivos ocultos y de configuración sensible
    location ~* /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(json|lock|yml|yaml|md|dockerfile)$ {
        deny all;
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Endpoint sensible de autenticacion con rate limiting estricto (fuerza bruta / bombardeo de correo)
    location /api/v1/auth/ {
        limit_req zone=subasta_auth_limit burst=5 nodelay;
        proxy_pass http://backend:8080/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints de registro con rate limiting dedicado (prevención de registro masivo)
    location /api/v1/onboarding/ {
        limit_req zone=subasta_onboarding_limit burst=3 nodelay;
        proxy_pass http://backend:8080/api/v1/onboarding/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy general hacia el backend de Spring Boot
    location /api/ {
        limit_req zone=subasta_api_limit burst=20 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
